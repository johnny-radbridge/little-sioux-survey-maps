<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#10143e;background:#f7f9fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1600px;margin:auto;padding:42px 40px 32px}.eyebrow{margin:0 0 13px;color:#245ce4;font-size:13px;letter-spacing:1.6px;font-weight:700}h1{font-size:clamp(28px,3.1vw,44px);line-height:1.15;letter-spacing:-1.5px;max-width:1050px;margin:0 0 30px}.layout{display:grid;grid-template-columns:355px minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid #dfe5ef;border-radius:6px;overflow:hidden}.list-panel{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:490px;max-height:850px}.all{flex-shrink:0;border-bottom:1px solid #dfe5ef!important}.list{overflow:auto;scrollbar-width:thin;scrollbar-color:#cbd4e3 transparent}.row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 35px;gap:14px;text-align:left;border:0;border-bottom:1px solid #edf0f5;background:#fff;padding:17px 20px;font:inherit;font-size:14px;line-height:1.45;color:inherit;cursor:pointer;position:relative}.row:hover{background:#f4f7fd}.row[aria-pressed=true]{background:#edf3ff;color:#154ec9;box-shadow:inset 3px 0 #2863ed}.row[aria-pressed=true] .name{font-weight:700}.row:focus-visible,button:focus-visible{outline:3px solid #efaa32;outline-offset:-3px}.count{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.bar{grid-column:1/-1;height:3px;background:#eef2f8;border-radius:3px;margin-top:-5px}.bar span{height:100%;display:block;background:#a7bfed;border-radius:3px}.row[aria-pressed=true] .bar span{background:#2863ed}.map-panel{padding:14px;display:flex;flex-direction:column;min-width:0}.map-heading{min-height:40px;display:flex;gap:14px;justify-content:space-between;align-items:flex-start;padding:1px 5px 12px;font-size:14px;line-height:1.5}.map-heading p{margin:0;color:#535e7c}.map-heading strong{color:#10143e}#clear{border:0;background:none;color:#245ce4;font:inherit;padding:0;white-space:nowrap;cursor:pointer}#clear:disabled{visibility:hidden}#map{flex:1;min-height:430px;border-radius:4px;border:1px solid #dce4e6;background:#eef2e9}.leaflet-container{font-family:Arial,Helvetica,sans-serif}.leaflet-tooltip{font-size:13px;color:#10143e;border:1px solid #dfe5ef;box-shadow:0 2px 8px #10143e15;padding:8px 11px}.leaflet-control-attribution{font-size:10px!important}.map-reset{background:white;border:0;width:32px;height:32px;cursor:pointer;color:#152143;font-size:22px}.map-error{padding:24px;color:#535e7c} @media(min-width:1500px){.layout{grid-template-columns:390px minmax(0,1fr)}}@media(max-width:760px){main{padding:26px 16px}h1{letter-spacing:-.8px;margin-bottom:22px}.eyebrow{font-size:11px}.layout{display:flex;flex-direction:column}.map-panel{order:-1;height:49vh;min-height:350px;padding:10px}#map{min-height:250px}.list-panel{height:420px;min-height:0}.map-heading{font-size:12px}.row{padding:14px 16px}}
.subtopics{background:#f8faff;padding:5px 0 8px}.subtopic{padding:11px 20px 11px 34px;font-size:13px;background:transparent}.subtopic[aria-pressed=true]{background:#e7effd}.subtopic .count{font-weight:400}nav{display:flex;gap:8px;margin:0 0 26px}nav button{font:inherit;font-size:13px;background:white;color:#535e7c;border:1px solid #dfe5ef;border-radius:4px;padding:9px 15px;cursor:pointer}nav button[aria-pressed=true]{color:#154ec9;background:#edf3ff;border-color:#b7c9ef}.list-panel{height:calc(100vh - 270px)}.legend{background:#fffffff2;border:1px solid #dfe5ef;border-radius:4px;padding:10px 12px;color:#303d55;font:12px Arial;box-shadow:0 1px 5px #0001}.legend-title{margin-bottom:7px;font-weight:bold}.legend-item{display:flex;align-items:center;gap:7px;margin-top:4px}.swatch{width:17px;height:10px;border-radius:2px;display:inline-block}.legend-items{display:flex;gap:12px;flex-wrap:wrap;max-width:280px}@media(max-width:760px){.list-panel{height:420px}nav{margin-bottom:24px}.legend{font-size:10px}.legend-items{gap:7px;max-width:200px}}
html,body{height:100%;overflow:hidden}
main{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);padding:18px 24px 20px;overflow:hidden}
nav{margin:0 0 12px;flex-shrink:0}
h1{font-size:clamp(22px,2.4vw,34px);line-height:1.16;letter-spacing:-.9px;max-width:none;margin:0 0 18px}
.layout{min-height:0;overflow:hidden}
.list-panel{height:100%;min-height:0;max-height:none}
.list{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain}
.map-panel{height:100%;min-height:0;overflow:hidden}
.map-heading{flex-shrink:0}
#map{min-height:0;min-width:0}
@media(max-width:760px){
 main{padding:12px;grid-template-rows:auto auto minmax(0,1fr)}
 nav{margin-bottom:10px}
 nav button{padding:7px 12px}
 h1{font-size:22px;line-height:1.15;margin-bottom:12px}
 .layout{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);gap:10px}
 .map-panel{grid-row:1;height:100%;min-height:0;padding:8px}
 .list-panel{grid-row:2;height:100%;min-height:0}
 #map{min-height:0}
 .map-heading{min-height:0;padding-bottom:6px}
 .legend{padding:6px 8px}
}
@media(max-height:600px) and (min-width:761px){
 main{padding:10px 18px}
 nav{margin-bottom:8px}nav button{padding:6px 12px}
 h1{font-size:24px;margin-bottom:10px}
}

.map-heading{align-items:center;flex-wrap:wrap;gap:8px 16px}
.map-heading>p{flex:1;min-width:180px}
.map-actions{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
.geometry-controls{display:flex;gap:5px}
.geometry-controls[hidden]{display:none}
.geometry-controls button{font:inherit;font-size:12px;font-weight:600;border:1px solid #b9ccef;border-radius:4px;background:#edf3ff;color:#154ec9;padding:6px 9px;cursor:pointer;white-space:nowrap}

.geometry-controls button[aria-pressed=false]{background:#fff5f5;border-color:#e9bcbc;color:#a74444}

.geometry-controls button:hover{border-color:#7189b6}
.leaflet-tooltip{max-width:280px;white-space:normal;line-height:1.5}
@media(max-width:760px){.map-actions{gap:8px}.geometry-controls button{padding:4px 7px;font-size:11px}}
.map-heading{padding-left:0;padding-right:0}
.map-actions{flex-wrap:nowrap}
.map-actions #clear{order:-1}
#clear:disabled{display:none}
.geometry-controls button{position:relative}
.geometry-controls button[aria-pressed=false]::after{content:'';position:absolute;left:50%;top:50%;width:1px;height:115%;background:currentColor;transform:translate(-50%,-50%) rotate(38deg);opacity:.6;pointer-events:none}

.feature-popup{font-size:13px;line-height:1.5;color:#10143e;padding:2px 0}
.feature-popup-heading{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding-right:18px}
.feature-popup-dot{width:11px;height:11px;border-radius:50%;flex:none}
.feature-popup-item{margin-top:5px}
.leaflet-popup-content{margin:16px 18px;max-width:calc(100vw - 90px)}
.leaflet-popup-content-wrapper{border-radius:6px}
.leaflet-container a.leaflet-popup-close-button{width:28px;height:28px;line-height:28px;color:#8a94a8;font-size:20px}

</style>
</head>
<body>
<main>
<nav aria-label="Survey question"><button data-question="11" aria-pressed="true">Question 11</button><button data-question="13" aria-pressed="false">Question 13</button><button data-question="16" aria-pressed="false">Question 16</button></nav>

<h1>Which stretches of the Little Sioux River have you paddled or floated?</h1>
<div class="layout">
<section class="panel list-panel" aria-label="River stretches">
<button class="row all" id="all" aria-pressed="true"><span class="name">All stretches</span><span class="count">634</span></button>
<div class="list" id="list"></div>
</section>
<section class="panel map-panel" aria-label="Map of selected river stretches">
<div class="map-heading"><p id="status" aria-live="polite"><strong>All stretches</strong> · 634 selections</p><button id="clear" disabled>Clear filter</button></div>
<div id="map" aria-label="Little Sioux River map"></div>
</section>
</div>
</main>
<script src="./data/maps.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';
const questions=window.SURVEY_MAP_DATA;
const list=document.getElementById('list'),status=document.getElementById('status'),clear=document.getElementById('clear'),all=document.getElementById('all');
let question,selected=null,selectedSubtype=null,map,layer,legend,rows,breaks;
const buttons=new Map(),palette=['#fff0b3','#ffc65c','#f88b36','#dc462b','#9d183b'];
const enabledGeometry={Polygons:true,Lines:true,Points:true};
const geometryKind=f=>/Polygon/.test(f.geometry.type)?'Polygons':/LineString/.test(f.geometry.type)?'Lines':'Points';
const geometryAllowed=f=>question.number!==16||enabledGeometry[geometryKind(f)];
function tooltipText(f){
 const p=f.properties;
 if(question.number!==16)return p.name+' · '+p.count;
 const category=question.categories.find(c=>c.id===p.id);
 const labels=(p.subtypes||[]).map(id=>category?.subtopics.find(s=>s.id===id)?.name).filter(Boolean);
 return labels.length?labels.join(' · '):'No subtopic selected';
}
const geometryControls=document.createElement('div');geometryControls.className='geometry-controls';geometryControls.setAttribute('role','group');geometryControls.setAttribute('aria-label','Map geometry visibility');
for(const name of Object.keys(enabledGeometry)){
 const button=document.createElement('button');button.type='button';button.textContent=name;button.setAttribute('aria-label',name);button.dataset.geometry=name;
 button.setAttribute('aria-pressed','true');button.title='Hide '+name.toLowerCase();
 button.addEventListener('click',()=>{
  enabledGeometry[name]=!enabledGeometry[name];
  button.setAttribute('aria-pressed',String(enabledGeometry[name]));
  button.title=(enabledGeometry[name]?'Hide ':'Show ')+name.toLowerCase();
  select(selected,selectedSubtype,false);
 });
 geometryControls.append(button);
}
const mapActions=document.createElement('div');mapActions.className='map-actions';
clear.before(mapActions);mapActions.append(geometryControls,clear);

function color(count){if(count===0)return '#9da8b6';return palette[breaks.findIndex(n=>count<=n)]||palette[4];}
function style(f){const p=f.properties,c=question.number===16?p.color:color(p.count);return {color:c,weight:question.number===16?3:4,opacity:1,fillColor:c,fillOpacity:.75};}
function updateLegend(){
 if(!legend)return;
 legend.replaceChildren();
 const title=document.createElement('div');title.className='legend-title';title.textContent=question.number===16?'Mapped places':'Selections';legend.append(title);
 const items=document.createElement('div');items.className='legend-items';legend.append(items);
 const entries=question.number===16?rows.filter(r=>selected===null||r.id===selected).map(r=>[r.color,r.name]):[['#9da8b6','0'],...breaks.map((n,i)=>[palette[i],(i?breaks[i-1]+1:1)===n?String(n):(i?breaks[i-1]+1:1)+'–'+n])];
 for(const [c,label]of entries){const item=document.createElement('div');item.className='legend-item';const swatch=document.createElement('span');swatch.className='swatch';swatch.style.background=c;item.append(swatch,document.createTextNode(label));items.append(item);}
}
// Test actual geometry against the viewport, including crossing lines and polygons.
function geometryInView(geometry,bounds){
 const west=bounds.getWest(),east=bounds.getEast(),south=bounds.getSouth(),north=bounds.getNorth();
 const inside=p=>p[0]>=west&&p[0]<=east&&p[1]>=south&&p[1]<=north;
 function segment(a,b){
  let lo=0,hi=1;
  const dx=b[0]-a[0],dy=b[1]-a[1];
  for(const [p,q]of [[-dx,a[0]-west],[dx,east-a[0]],[-dy,a[1]-south],[dy,north-a[1]]]){
   if(p===0){if(q<0)return false;continue;}
   const t=q/p;if(p<0)lo=Math.max(lo,t);else hi=Math.min(hi,t);
   if(lo>hi)return false;
  }
  return true;
 }
 const line=coords=>coords.some(inside)||coords.slice(1).some((p,i)=>segment(coords[i],p));
 function inRing(p,ring){
  let yes=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
   const a=ring[i],b=ring[j];
   if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])yes=!yes;
  }
  return yes;
 }
 const polygon=rings=>rings.some(line)||[[west,south],[west,north],[east,south],[east,north]].some(p=>inRing(p,rings[0])&&!rings.slice(1).some(r=>inRing(p,r)));
 switch(geometry.type){
  case 'Point':return inside(geometry.coordinates);
  case 'MultiPoint':return geometry.coordinates.some(inside);
  case 'LineString':return line(geometry.coordinates);
  case 'MultiLineString':return geometry.coordinates.some(line);
  case 'Polygon':return polygon(geometry.coordinates);
  case 'MultiPolygon':return geometry.coordinates.some(polygon);
  case 'GeometryCollection':return geometry.geometries.some(g=>geometryInView(g,bounds));
  default:return false;
 }
}
let viewFeatures=[];
function updateViewport(){
 viewFeatures=map&&layer?question.features.filter(f=>geometryAllowed(f)&&geometryInView(f.geometry,map.getBounds())):question.features.filter(geometryAllowed);
 const counts=new Map(),ids=new Set();
 for(const f of viewFeatures){
  const p=f.properties;ids.add(p.id);counts.set(p.id,(counts.get(p.id)||0)+(question.number===16?1:p.count));
 }
 const max=Math.max(1,...counts.values());
 for(const row of rows){
  const b=buttons.get(row.id);
  b.style.display=ids.has(row.id)?'':'none';
  b.querySelector('.count').textContent=counts.get(row.id)||0;
  b.querySelector('.bar span').style.width=((counts.get(row.id)||0)/max*100)+'%';
 }
 all.querySelector('.count').textContent=[...counts.values()].reduce((a,b)=>a+b,0);
 const visible=viewFeatures.filter(f=>(selected===null||f.properties.id===selected)&&(selectedSubtype===null||f.properties.subtypes?.includes(selectedSubtype)));
 const count=question.number===16?visible.length:visible.reduce((s,f)=>s+f.properties.count,0);
 const row=rows.find(r=>r.id===selected),subtopic=row?.subtopics?.find(s=>s.id===selectedSubtype);
 const label=document.createElement('strong');label.textContent=subtopic?row.name+' · '+subtopic.name:selected===null?(question.number===16?'All mapped places':'All stretches'):row.name;
 status.replaceChildren(label,document.createTextNode(' · '+count+' '+(question.number===16?(count===1?'place':'places'):(count===1?'selection':'selections'))));
 renderSubtopics();updateLegend();
}

function renderSubtopics(){
 for(const el of list.querySelectorAll('.subtopics'))el.remove();
 for(const b of buttons.values())if(question.number===16)b.setAttribute('aria-expanded',String(b===buttons.get(selected)));
 if(question.number!==16||selected===null)return;
 const category=rows.find(r=>r.id===selected),group=document.createElement('div');
 const places=viewFeatures.filter(f=>f.properties.id===selected);
 if(!places.length)return;
 group.className='subtopics';group.setAttribute('role','group');group.setAttribute('aria-label',category.name);
 for(const st of category.subtopics){
  const visibleCount=places.filter(f=>f.properties.subtypes.includes(st.id)).length;
  if(!visibleCount)continue;
  const b=document.createElement('button');b.className='row subtopic';b.dataset.subtopic=st.id;b.setAttribute('aria-pressed',String(st.id===selectedSubtype));
  const label=document.createElement('span');label.textContent=st.name;
  const count=document.createElement('span');count.className='count';count.textContent=visibleCount;
  b.append(label,count);b.addEventListener('click',()=>{const next=selectedSubtype===st.id?null:st.id;select(selected,next);const newGroup=list.querySelector('.subtopics');Array.from(newGroup?.children||[]).find(el=>el.dataset.subtopic===st.id)?.focus({preventScroll:true});});
  group.append(b);
 }
 buttons.get(selected).after(group);
}
function select(id,subtype=null,fit=true){
 selected=id;selectedSubtype=subtype;all.setAttribute('aria-pressed',String(id===null));clear.disabled=id===null;
 for(const [key,b]of buttons)b.setAttribute('aria-pressed',String(key===id));
 const features=question.features.filter(f=>geometryAllowed(f)&&(id===null||f.properties.id===id)&&(selectedSubtype===null||f.properties.subtypes?.includes(selectedSubtype)));
 if(layer){layer.clearLayers();layer.addData({type:'FeatureCollection',features});if(fit&&layer.getBounds().isValid())map.fitBounds(layer.getBounds(),{padding:[32,32],maxZoom:id===null?11:13,animate:false});}
 updateViewport();
}
function showQuestion(number){
 question=questions.find(q=>q.number===number)||questions[0];selected=null;selectedSubtype=null;
 geometryControls.hidden=question.number!==16;
 document.querySelector('h1').textContent=question.title;
 document.querySelector('.list-panel').setAttribute('aria-label',question.number===16?'Mapped place categories':'River stretches');
 document.querySelector('.map-panel').setAttribute('aria-label',question.number===16?'Map of places':'Map of selected river stretches');
 for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-pressed',String(Number(b.dataset.question)===question.number));
 rows=question.categories||question.features.map(f=>f.properties);
 const max=Math.max(...rows.map(r=>r.count));
 breaks=question.number===13?[1,2,4,6,8]:[8,16,24,32,40];
 list.replaceChildren();buttons.clear();
 all.querySelector('.name').textContent=question.number===16?'All mapped places':'All stretches';
 all.querySelector('.count').textContent=rows.reduce((s,r)=>s+r.count,0);
 for(const p of rows){
  const b=document.createElement('button');b.className='row';b.setAttribute('aria-pressed','false');
  const name=document.createElement('span');name.className='name';name.textContent=p.name;
  const count=document.createElement('span');count.className='count';count.textContent=p.count;
  const bar=document.createElement('span');bar.className='bar';bar.setAttribute('aria-hidden','true');
  const fill=document.createElement('span');fill.style.width=(p.count/max*100)+'%';fill.style.background=p.color||color(p.count);bar.append(fill);
  b.append(name,count,bar);b.addEventListener('click',()=>select(selected===p.id?null:p.id));list.append(b);buttons.set(p.id,b);
 }
 list.scrollTop=0;select(null);
}
all.addEventListener('click',()=>select(null));clear.addEventListener('click',()=>select(null));
for(const b of document.querySelectorAll('nav button'))b.addEventListener('click',()=>{history.replaceState(null,'','#question-'+b.dataset.question);showQuestion(Number(b.dataset.question));});
showQuestion(Number(location.hash.replace('#question-',''))||11);
if(typeof L!=='undefined'){
 map=L.map('map');
 document.addEventListener('click',event=>{if(!document.getElementById('map').contains(event.target))map.closePopup();});
 for(const [name,z]of [['Polygons',410],['Lines',420],['Points',430]])map.createPane('survey'+name).style.zIndex=z;
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
 layer=L.geoJSON(null,{style,pointToLayer:(f,latlng)=>L.circleMarker(latlng,{...style(f),pane:'surveyPoints',radius:6,weight:1.2,color:'#fff',fillOpacity:.85}),onEachFeature:(f,l)=>{
  l.options.pane='survey'+geometryKind(f);
  const p=f.properties,tip=document.createElement('span');tip.textContent=tooltipText(f);
  l.bindTooltip(tip,{sticky:true});
  {
   const content=document.createElement('div');content.className='feature-popup';
   const heading=document.createElement('div');heading.className='feature-popup-heading';
   const dot=document.createElement('span');dot.className='feature-popup-dot';dot.style.background=question.number===16?p.color:color(p.count);
   const title=document.createElement('strong');title.textContent=p.name;heading.append(dot,title);content.append(heading);
   const category=question.categories?.find(c=>c.id===p.id);
   const labels=question.number===16?(p.subtypes||[]).map(id=>category?.subtopics.find(s=>s.id===id)?.name).filter(Boolean):[p.count+' '+(p.count===1?'selection':'selections')];
   for(const label of labels.length?labels:['No subtopic selected']){
    const item=document.createElement('div');item.className='feature-popup-item';item.textContent=label;content.append(item);
   }
   l.bindPopup(content,{minWidth:260,maxWidth:340,closeButton:true,autoClose:true,closeOnClick:true,autoPan:true});
   l.on('popupopen',()=>l.closeTooltip());
  }
 }}).addTo(map);
 L.control.scale({imperial:true,metric:false}).addTo(map);
 const Legend=L.Control.extend({options:{position:'bottomright'},onAdd:()=>{legend=L.DomUtil.create('div','legend');L.DomEvent.disableClickPropagation(legend);return legend;}});new Legend().addTo(map);
 const Reset=L.Control.extend({options:{position:'topright'},onAdd:()=>{const wrap=L.DomUtil.create('div','leaflet-bar'),b=L.DomUtil.create('button','map-reset',wrap);b.type='button';b.textContent='⤢';b.title='Fit map';b.setAttribute('aria-label','Fit map');L.DomEvent.disableClickPropagation(wrap);b.addEventListener('click',()=>{if(layer.getBounds().isValid())map.fitBounds(layer.getBounds(),{padding:[32,32],maxZoom:13});});return wrap;}});
 new Reset().addTo(map);select(null);
 map.on('moveend resize',updateViewport);
 new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));
}else document.getElementById('map').innerHTML='<p class="map-error">Map unavailable. Check your internet connection and reload.</p>';
</script>

</body>
